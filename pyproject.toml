[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-conformal"
version = "1.0.0"
description = "Generative conformal prediction with Optimized Ranking and Coverage Allocation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "matplotlib>=3.7",
    "ortools>=9.7",
]

[project.optional-dependencies]
forest = ["quantile-forest>=1.3"]
notebook = ["jupyter>=1.0"]

[tool.setuptools.packages.find]
include = ["orca*"]

